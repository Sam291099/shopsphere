
server:
  port: 8080

spring:
  application:
    name: shopsphere-api

  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere
    username: shopsphere_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  otp:
    expiration-minutes: 5
    resend-cooldown-seconds: 60
    max-attempts: 5

    password-reset:
    token-expiration-minutes: 10